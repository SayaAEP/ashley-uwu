# Release Workflow
# Manually trigger to create a versioned release with auto-generated changelog.
#
# How to use:
#   1. Go to Actions > Release > Run workflow
#   2. Choose version bump type (patch / minor / major)
#   3. Workflow bumps version, generates changelog, creates GitHub Release
#
# Commit format (Conventional Commits 1.0.0):
#   feat: add echo plugin             → Features
#   feat(preset): add preset manager  → Features (scope shown)
#   fix: resolve MongoDB timeout      → Bug Fixes
#   docs: update plugin guide         → Documentation
#   refactor: clean up logger         → Refactors
#   chore: update dependencies        → Chores
#   feat!: drop legacy auth           → Features + Breaking Changes
#   any commit with a "BREAKING CHANGE:" footer → Breaking Changes
#
# Bump type "auto" derives the semver bump from the commits:
#   breaking change → major, feat: → minor, otherwise → patch

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Bump version
        id: bump
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          BUMP="${{ inputs.bump }}"

          if [ "$BUMP" = "auto" ]; then
            if git log $RANGE --pretty=format:"%s" | grep -Eq '^[A-Za-z]+(\([^)]*\))?!:' \
              || git log $RANGE --pretty=format:"%b" | grep -q 'BREAKING CHANGE:'; then
              BUMP="major"
            elif git log $RANGE --pretty=format:"%s" | grep -Eq '^feat(\([^)]*\))?:'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            echo "Auto bump type: $BUMP"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version in package.json
        run: |
          npm version ${{ steps.bump.outputs.version }} --no-git-tag-version

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          echo "Generating changelog for range: $RANGE"

          {
            echo "changelog<<CHANGELOG_EOF"

            node - "$RANGE" <<'NODE'
          const { execFileSync } = require('node:child_process');

          const range = process.argv[2];
          const raw = execFileSync(
            'git',
            ['log', range, '--pretty=format:%s%x1f%b%x1e'],
            { encoding: 'utf8' },
          );

          const commits = raw
            .split('\x1e')
            .map((entry) => entry.trim())
            .filter(Boolean)
            .map((entry) => {
              const [subject, ...body] = entry.split('\x1f');
              return {
                subject: (subject || '').trim(),
                body: body.join('\x1f').trim(),
              };
            });

          const HEADER = /^([A-Za-z]+)(?:\(([^)]*)\))?(!)?:\s*(.*)$/;
          const SECTIONS = [
            ['feat', 'Features'],
            ['fix', 'Bug Fixes'],
            ['perf', 'Performance'],
            ['docs', 'Documentation'],
            ['refactor', 'Refactors'],
            ['chore', 'Chores'],
            ['test', 'Tests'],
            ['build', 'Build System'],
            ['ci', 'CI'],
            ['style', 'Styles'],
          ];

          const groups = new Map(SECTIONS.map(([type]) => [type, []]));
          const other = [];
          const breaking = [];

          for (const commit of commits) {
            const match = HEADER.exec(commit.subject);

            if (!match) {
              other.push('- ' + commit.subject);
              continue;
            }

            const isBreaking =
              Boolean(match[3]) ||
              /(^|\n)BREAKING CHANGE:/.test(commit.body);

            const scope = match[2] ? '**' + match[2] + ':** ' : '';
            const line = '- ' + scope + match[4];

            if (isBreaking) breaking.push(line);
            if (groups.has(match[1])) groups.get(match[1]).push(line);
            else other.push(line);
          }

          const parts = [];

          if (breaking.length > 0) {
            parts.push('### ⚠ BREAKING CHANGES', ...breaking, '');
          }

          for (const [type, title] of SECTIONS) {
            const items = groups.get(type);
            if (items.length > 0) parts.push('### ' + title, ...items, '');
          }

          if (other.length > 0) {
            parts.push('### Other Changes', ...other, '');
          }

          console.log(parts.join('\n'));
          NODE

            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git push

      - name: Create tag
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "v${{ steps.bump.outputs.version }}"
          body: |
            ## Ashley UwU v${{ steps.bump.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ---
            **Full Changelog:** https://github.com/${{ github.repository }}/compare/v${{ steps.current.outputs.version }}...v${{ steps.bump.outputs.version }}
          draft: false
          prerelease: false